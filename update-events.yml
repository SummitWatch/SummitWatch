name: Update event listings

# Free tier notes:
# - Public GitHub repos get unlimited Actions minutes on standard runners.
# - This runs weekly (Monday 06:00 UTC) plus on-demand via the Actions tab.
# - No paid services, no server, no hosting cost — GitHub Pages serves the
#   site itself for free from the same repo.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}   # lets you click "Run workflow" manually in the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r scraper/requirements.txt
          playwright install --with-deps chromium

      - name: Run scraper
        run: python scraper/scrape_events.py

      - name: Commit updated events.json if changed
        run: |
          git config user.name "summit-manifest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add events.json
          git diff --staged --quiet || git commit -m "Auto-update event listings"
          git push
